<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신규 공공소스 공고 미리보기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; }

  .header { background: #1e293b; color: white; padding: 20px 24px; }
  .header h1 { font-size: 1.25rem; font-weight: 700; }
  .header p  { font-size: .85rem; color: #94a3b8; margin-top: 4px; }

  .controls { background: white; padding: 16px 24px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

  .src-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .src-tab {
    padding: 6px 14px; border-radius: 20px; font-size: .83rem; font-weight: 600;
    cursor: pointer; border: 2px solid transparent; transition: all .15s;
  }
  .src-tab.active { color: white; }
  .src-tab[data-src="전체"]         { border-color:#64748b; color:#64748b; }
  .src-tab[data-src="전체"].active  { background:#64748b; color:white; }
  .src-tab[data-src="나라일터"]      { border-color:#4F46E5; color:#4F46E5; }
  .src-tab[data-src="나라일터"].active { background:#4F46E5; color:white; }
  .src-tab[data-src="클린아이"]      { border-color:#0284C7; color:#0284C7; }
  .src-tab[data-src="클린아이"].active { background:#0284C7; color:white; }
  .src-tab[data-src="인천일자리"]    { border-color:#7C3AED; color:#7C3AED; }
  .src-tab[data-src="인천일자리"].active { background:#7C3AED; color:white; }
  .src-tab[data-src="경기공공일자리"] { border-color:#D97706; color:#D97706; }
  .src-tab[data-src="경기공공일자리"].active { background:#D97706; color:white; }

  .search-box { flex: 1; min-width: 200px; }
  .search-box input {
    width: 100%; padding: 8px 14px; border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: .9rem; outline: none;
  }
  .search-box input:focus { border-color: #94a3b8; }

  .stats { background: white; padding: 12px 24px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 20px; font-size: .85rem; color: #475569; }
  .stat-item span { font-weight: 700; color: #1e293b; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  thead tr { background: #f1f5f9; }
  th { padding: 10px 14px; text-align: left; font-weight: 600; color: #64748b; white-space: nowrap; border-bottom: 2px solid #e2e8f0; }
  tbody tr { border-bottom: 1px solid #f1f5f9; transition: background .1s; }
  tbody tr:hover { background: #f8fafc; }
  td { padding: 10px 14px; vertical-align: middle; }

  .src-badge {
    display: inline-block; padding: 3px 8px; border-radius: 5px; font-size: .75rem; font-weight: 700; white-space: nowrap;
  }
  .src-나라일터      { background:#EEF2FF; color:#4F46E5; }
  .src-클린아이      { background:#E0F2FE; color:#0284C7; }
  .src-인천일자리    { background:#F5F3FF; color:#7C3AED; }
  .src-경기공공일자리 { background:#FFFBEB; color:#D97706; }

  .title-cell { max-width: 380px; }
  .title-link { color: #1e293b; text-decoration: none; font-weight: 600; line-height: 1.4; display: block; }
  .title-link:hover { color: #3b82f6; text-decoration: underline; }
  .company-small { font-size: .78rem; color: #64748b; margin-top: 3px; }

  .loc-badge { font-size: .78rem; background: #eff6ff; color: #2563eb; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
  .type-badge { font-size: .78rem; background: #f0fdf4; color: #16a34a; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }

  .deadline { font-size: .82rem; font-weight: 600; white-space: nowrap; }
  .deadline.soon   { color: #dc2626; }
  .deadline.normal { color: #1e293b; }
  .deadline.always { color: #7c3aed; }

  .empty { text-align: center; padding: 60px 20px; color: #94a3b8; font-size: .95rem; }

  .section-head { padding: 16px 24px 4px; }
  .section-head h2 { font-size: 1rem; font-weight: 700; color: #334155; }

  /* 요약 카드 */
  .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 16px 24px; }
  @media (max-width: 700px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
  .sum-card { background: white; border-radius: 10px; padding: 14px 16px; border: 1.5px solid #e2e8f0; }
  .sum-card .label { font-size: .78rem; color: #64748b; font-weight: 600; margin-bottom: 4px; }
  .sum-card .count { font-size: 1.5rem; font-weight: 800; }
  .sum-나라일터 .count    { color: #4F46E5; }
  .sum-클린아이 .count    { color: #0284C7; }
  .sum-인천일자리 .count  { color: #7C3AED; }
  .sum-경기공공일자리 .count { color: #D97706; }
</style>
</head>
<body>

<div class="header">
  <h1>🔍 신규 공공소스 공고 미리보기</h1>
  <p>나라일터 · 클린아이 · 인천일자리 · 경기공공일자리 — 사이트 반영 전 품질 확인용</p>
</div>

<div id="summary-grid" class="summary-grid"></div>

<div class="controls">
  <div class="src-tabs" id="srcTabs">
    <button class="src-tab active" data-src="전체">전체</button>
    <button class="src-tab" data-src="나라일터">나라일터</button>
    <button class="src-tab" data-src="클린아이">클린아이</button>
    <button class="src-tab" data-src="인천일자리">인천일자리</button>
    <button class="src-tab" data-src="경기공공일자리">경기공공일자리</button>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="공고명 / 기관명 검색…" oninput="render()">
  </div>
</div>

<div class="stats" id="statsBar"></div>

<div class="table-wrap">
  <table id="jobTable">
    <thead>
      <tr>
        <th>#</th>
        <th>출처</th>
        <th>공고명</th>
        <th>지역</th>
        <th>고용형태</th>
        <th>마감일</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="emptyMsg" class="empty" style="display:none">검색 결과가 없습니다.</div>
</div>

<script>
let allJobs = [];
let currentSrc = '전체';

// test_new_sources_result.json 로드
fetch('test_new_sources_result.json')
  .then(r => r.json())
  .then(data => {
    allJobs = data.jobs || [];
    buildSummary(data.source_counts || {});
    render();
  })
  .catch(err => {
    document.getElementById('tbody').innerHTML =
      `<tr><td colspan="6" class="empty">⚠️ test_new_sources_result.json을 찾을 수 없습니다.<br>같은 폴더에 있는지 확인하세요.<br><small>${err}</small></td></tr>`;
  });

function buildSummary(counts) {
  const grid = document.getElementById('summary-grid');
  const srcList = ['나라일터','클린아이','인천일자리','경기공공일자리'];
  const srcKey  = {'나라일터':'나라일터','클린아이':'클린아이','인천일자리':'인천일자리','경기공공일자리':'경기공공일자리'};
  const labels  = {'나라일터':'나라일터\n공무직·임기제','클린아이':'클린아이\n지방공기업','인천일자리':'인천일자리\n인천시 공공','경기공공일자리':'경기공공일자리\n경기 공공기관'};
  grid.innerHTML = srcList.map(s => {
    const cnt = counts[s] ?? allJobs.filter(j=>j.source===s).length;
    return `<div class="sum-card sum-${s}" onclick="filterSrc('${s}')">
      <div class="label">${labels[s].replace('\n','<br>')}</div>
      <div class="count">${cnt.toLocaleString()}건</div>
    </div>`;
  }).join('');
}

function filterSrc(src) {
  currentSrc = src;
  document.querySelectorAll('.src-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.src === src);
  });
  render();
}

document.getElementById('srcTabs').addEventListener('click', e => {
  if (e.target.classList.contains('src-tab')) {
    filterSrc(e.target.dataset.src);
  }
});

function today() {
  return new Date().toISOString().slice(0,10);
}

function deadlineClass(dl) {
  if (!dl || dl === '상시모집') return 'always';
  const diff = (new Date(dl) - new Date(today())) / 86400000;
  return diff <= 7 ? 'soon' : 'normal';
}

function render() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let jobs = allJobs;

  if (currentSrc !== '전체') jobs = jobs.filter(j => j.source === currentSrc);
  if (q) jobs = jobs.filter(j => (j.title+j.company+j.location).toLowerCase().includes(q));

  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('emptyMsg');
  const stats = document.getElementById('statsBar');

  if (jobs.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = '';
  } else {
    empty.style.display = 'none';
    tbody.innerHTML = jobs.map((j,i) => {
      const src  = j.source || '';
      const dl   = j.deadline || '';
      const dlCls = deadlineClass(dl);
      const dlTxt = dl === '상시모집' ? '상시모집' : (dl || '—');
      return `<tr>
        <td style="color:#94a3b8;font-size:.8rem">${i+1}</td>
        <td><span class="src-badge src-${src}">${src}</span></td>
        <td class="title-cell">
          <a class="title-link" href="${j.apply_link||'#'}" target="_blank" rel="noopener">${esc(j.title)}</a>
          ${j.company ? `<div class="company-small">${esc(j.company)}</div>` : ''}
        </td>
        <td>${j.location ? `<span class="loc-badge">${esc(j.location)}</span>` : '—'}</td>
        <td>${j.type ? `<span class="type-badge">${esc(j.type)}</span>` : '—'}</td>
        <td><span class="deadline ${dlCls}">${dlTxt}</span></td>
      </tr>`;
    }).join('');
  }

  // 출처별 통계
  const srcCounts = {};
  jobs.forEach(j => { srcCounts[j.source] = (srcCounts[j.source]||0)+1; });
  const srcStr = Object.entries(srcCounts).map(([k,v])=>`<b>${k}</b> ${v}건`).join(' &nbsp;|&nbsp; ');
  stats.innerHTML = `<div>표시: <span>${jobs.length.toLocaleString()}건</span></div><div>${srcStr}</div>`;
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
