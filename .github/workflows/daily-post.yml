name: 매일 정보 글 발행

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: 미발행 글 1개 발행
        run: |
          python3 - << 'PYEOF'
          import urllib.request, json, datetime

          sb_url = 'https://riomousxlyvwmembuhvc.supabase.co'
          sb_key = 'sb_publishable_EULGblJ83IkmxLh9VMXnxQ_lcMgnmAh'
          headers_get = {'apikey': sb_key, 'Authorization': 'Bearer ' + sb_key}

          req = urllib.request.Request(
              sb_url + '/rest/v1/info_posts?select=id,title&published_at=is.null&order=created_at.asc&limit=1',
              headers=headers_get
          )
          with urllib.request.urlopen(req) as r:
              posts = json.loads(r.read())

          if not posts:
              print('발행할 글이 없습니다.')
              exit(0)

          post_id = posts[0]['id']
          title   = posts[0]['title']
          now = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%S.000Z')

          patch = urllib.request.Request(
              sb_url + '/rest/v1/info_posts?id=eq.' + str(post_id),
              data=json.dumps({'published_at': now}).encode(),
              headers={**headers_get,
                       'Content-Type': 'application/json',
                       'Prefer': 'return=minimal'},
              method='PATCH'
          )
          with urllib.request.urlopen(patch) as r:
              print('발행 완료:', title)
          PYEOF
