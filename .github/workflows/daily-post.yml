name: 매일 정보 글 자동 생성

on:
  schedule:
    # KST 10:00 (UTC 01:00) — 크롤러(UTC 23:00)와 시간 분리
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Claude로 정보 글 생성 후 Supabase 저장
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, re

          api_key = os.environ['ANTHROPIC_API_KEY']
          sb_url  = 'https://riomousxlyvwmembuhvc.supabase.co'
          sb_key  = 'sb_publishable_EULGblJ83IkmxLh9VMXnxQ_lcMgnmAh'

          prompt = """50대 이상 중장년 구직자를 위한 실용적인 취업·직장 정보 글을 JSON으로 작성해주세요.

아래 주제 중 하나를 골라 신선한 내용으로 작성하세요:
근로계약서 주의사항, 4대보험 가입 기준, 주휴수당 계산법, 최저임금 확인법,
퇴직금 조건, 고용24 사용법, 면접 복장 팁, 자기소개서 작성법,
나이 차별 없이 뽑는 직종, 급여명세서 이해하기, 연차 계산법,
국민취업지원제도 활용, 시간제 파트타임 권리, 재취업 자신감 키우기

반드시 아래 JSON 형식만 출력하세요 (마크다운·설명 없이):
{
  "category": "카테고리 (예: 노동 권리 / 취업 준비 / 면접 팁 / 급여 정보)",
  "category_color": "#16진색상코드",
  "title": "실용적이고 명확한 제목",
  "summary": "한 줄 부제목 (40자 이내)",
  "content": "본문 HTML (600~900자, <h3>소제목</h3> <p>본문</p> 구조, 필요시 <ul><li> 사용)",
  "tags": ["태그1", "태그2", "태그3"]
}"""

          # Claude API 호출
          body = json.dumps({
              'model': 'claude-haiku-4-5-20251001',
              'max_tokens': 2000,
              'messages': [{'role': 'user', 'content': prompt}]
          }).encode()

          req = urllib.request.Request(
              'https://api.anthropic.com/v1/messages',
              data=body,
              headers={
                  'x-api-key': api_key,
                  'anthropic-version': '2023-06-01',
                  'content-type': 'application/json'
              }
          )
          with urllib.request.urlopen(req) as r:
              result = json.loads(r.read())

          text = result['content'][0]['text'].strip()
          m = re.search(r'\{[\s\S]*\}', text)
          post = json.loads(m.group() if m else text)
          post['author'] = '동네로 AI'

          # Supabase INSERT
          insert_body = json.dumps(post).encode()
          insert_req = urllib.request.Request(
              f'{sb_url}/rest/v1/info_posts',
              data=insert_body,
              headers={
                  'apikey': sb_key,
                  'Authorization': f'Bearer {sb_key}',
                  'Content-Type': 'application/json',
                  'Prefer': 'return=minimal'
              },
              method='POST'
          )
          with urllib.request.urlopen(insert_req) as r:
              print(f'✅ 저장 완료: {post["title"]}')
          PYEOF
