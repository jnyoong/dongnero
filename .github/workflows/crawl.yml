name: 매일 08시30분 크롤링 & 배포

on:
  schedule:
    # 한국시간 08:30 = UTC 23:30 (전날)
    - cron: '30 23 * * *'
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 오늘 로컬 크롤링 여부 확인 (KST 기준)
        id: check_local
        run: |
          TODAY=$(TZ='Asia/Seoul' date +'%Y-%m-%d')
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          if [ -f last_crawl.txt ] && [ "$(cat last_crawl.txt | tr -d '[:space:]')" = "$TODAY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "오늘($TODAY) 로컬 크롤링 기록 있음 → 스킵"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "로컬 크롤링 기록 없음 → Actions 크롤링 실행"
          fi

      - name: 크롤링 시작 텔레그램 알림
        if: steps.check_local.outputs.skip == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TODAY=$(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"🔄 *[GitHub Actions] 크롤링 시작* (${TODAY} KST)\\n로컬 크롤링 없음 → Actions 대신 실행\",\"parse_mode\":\"Markdown\"}" || true

      - name: Python 설정
        if: steps.check_local.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        if: steps.check_local.outputs.skip == 'false'
        run: pip install -r requirements.txt

      - name: 크롤러 실행
        if: steps.check_local.outputs.skip == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crawler.py

      - name: 정보게시판 정적 HTML 빌드
        if: steps.check_local.outputs.skip == 'false'
        run: python build_posts.py

      - name: 변경사항 커밋 & 푸시
        if: steps.check_local.outputs.skip == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json jobs_data.js excluded_data.js posts/ sitemap.xml last_crawl.txt last_notify_date.txt
          git diff --cached --quiet || git commit -m "daily update $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push

      - name: 배포 완료 텔레그램 알림
        if: steps.check_local.outputs.skip == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TODAY=$(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"✅ *[GitHub Actions] 배포 완료* (${TODAY} KST)\\njobs.json push → dongnero.kr 반영 중\",\"parse_mode\":\"Markdown\"}" || true

      - name: 평일 여부 확인 (KST 기준)
        id: check_weekday
        if: steps.check_local.outputs.skip == 'false'
        run: |
          # KST 기준 요일 확인 (1=월 ~ 7=일, 6·7이면 주말)
          DAY=$(TZ='Asia/Seoul' date +'%u')
          if [ "$DAY" -le 5 ]; then
            echo "is_weekday=true" >> $GITHUB_OUTPUT
            echo "평일($DAY) — 알림 발송 예정"
          else
            echo "is_weekday=false" >> $GITHUB_OUTPUT
            echo "주말($DAY) — 알림 발송 스킵"
          fi

      - name: 신규 일자리 알림 발송
        if: steps.check_local.outputs.skip == 'false' && steps.check_weekday.outputs.is_weekday == 'true'
        env:
          SOLAPI_API_KEY:       ${{ secrets.SOLAPI_API_KEY }}
          SOLAPI_API_SECRET:    ${{ secrets.SOLAPI_API_SECRET }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          OPERATOR_PHONE:       ${{ secrets.OPERATOR_PHONE }}
          KAKAO_PFID:           ${{ secrets.KAKAO_PFID }}
          KAKAO_TMPL_WITH_JOB:  ${{ secrets.KAKAO_TMPL_WITH_JOB }}
          KAKAO_TMPL_NO_JOB:    ${{ secrets.KAKAO_TMPL_NO_JOB }}
          SENDER_NUMBER:        ${{ secrets.SENDER_NUMBER }}
        run: python notify.py
