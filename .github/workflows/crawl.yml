name: 매일 07시 크롤링 & 배포

on:
  schedule:
    # 한국시간 07:00 = UTC 22:00 (전날)
    - cron: '0 22 * * *'
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 오늘 로컬 크롤링 여부 확인 (KST 기준)
        id: check_local
        run: |
          TODAY=$(TZ='Asia/Seoul' date +'%Y-%m-%d')
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          if [ -f last_crawl.txt ] && [ "$(cat last_crawl.txt | tr -d '[:space:]')" = "$TODAY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "오늘($TODAY) 로컬 크롤링 기록 있음 → 스킵"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "로컬 크롤링 기록 없음 → Actions 크롤링 실행"
          fi

      - name: Python 설정
        if: steps.check_local.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        if: steps.check_local.outputs.skip == 'false'
        run: pip install -r requirements.txt

      - name: 크롤러 실행
        if: steps.check_local.outputs.skip == 'false'
        run: python crawler.py

      - name: 변경사항 커밋 & 푸시
        if: steps.check_local.outputs.skip == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json jobs_data.js excluded_data.js
          git diff --cached --quiet || git commit -m "daily update $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
