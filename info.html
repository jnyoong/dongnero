<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>동네로 — 정보게시판</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1E40AF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="동네로" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <!--
  ── Supabase post_comments 테이블 생성 SQL ────────────────────────────────
  Supabase 대시보드 > SQL Editor에서 아래를 실행하세요:

  CREATE TABLE post_comments (
    id bigint generated always as identity primary key,
    post_id text not null,
    author_name text not null default '익명',
    content text not null,
    created_at timestamptz default now()
  );
  ALTER TABLE post_comments ENABLE ROW LEVEL SECURITY;
  CREATE POLICY "read_all"   ON post_comments FOR SELECT USING (true);
  CREATE POLICY "insert_all" ON post_comments FOR INSERT WITH CHECK (length(content) between 1 and 500);
  ─────────────────────────────────────────────────────────────────────────
  -->

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #FFF9F4;
      --surface:   #FFFFFF;
      --border:    #EDE5DC;
      --border-h:  #D4C4B8;
      --text-pri:  #1C1917;
      --text-sec:  #6B6560;
      --text-ter:  #A8A29E;
      --blue:      #2563EB;
      --blue-lt:   #EFF6FF;
      --orange:    #EA580C;
      --green:     #15803D;
      --purple:    #7C3AED;
      --radius:    16px;
      --radius-lg: 20px;
      --shadow:    0 2px 10px rgba(0,0,0,.07);
    }

    body {
      font-family: 'Malgun Gothic','맑은 고딕',system-ui,sans-serif;
      background: var(--bg);
      color: var(--text-pri);
      min-height: 100vh;
      line-height: 1.6;
      font-size: 16px;
    }

    /* ── 햄버거 버튼 ── */
    .btn-menu {
      background: none; border: none; cursor: pointer;
      padding: 6px 6px 6px 2px; color: var(--text-pri);
      display: flex; align-items: center; flex-shrink: 0;
      font-size: 1.25rem; line-height: 1;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── 드로어 ── */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 400; opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .drawer-overlay.show { opacity: 1; pointer-events: auto; }
    .drawer {
      position: absolute; top: 0; left: 0; bottom: 0; width: 280px;
      background: var(--surface); display: flex; flex-direction: column;
      overflow-y: auto; transform: translateX(-100%);
      transition: transform .3s cubic-bezier(.32,0,.16,1);
    }
    .drawer::-webkit-scrollbar { display: none; }
    .drawer-overlay.show .drawer { transform: translateX(0); }
    .drawer-head {
      background: linear-gradient(135deg,#1E40AF,#2563EB);
      padding: 28px 20px 20px; display: flex; align-items: center; gap: 12px;
      position: relative; overflow: hidden;
    }
    .drawer-head::before {
      content: ''; position: absolute; right: -20px; top: -20px;
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(255,255,255,.08);
    }
    .drawer-head-icon { width: 42px; height: 42px; border-radius: 10px; position: relative; }
    .drawer-head-name { font-size: 1.35rem; font-weight: 900; color: #fff; position: relative; }
    .drawer-head-sub  { font-size: .78rem; color: rgba(255,255,255,.75); position: relative; }
    .drawer-menu { padding: 8px 0; flex: 1; }
    .drawer-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 20px; background: none; border: none;
      width: 100%; text-align: left; cursor: pointer; font-family: inherit;
      color: var(--text-pri); text-decoration: none;
      transition: background .15s; -webkit-tap-highlight-color: transparent;
    }
    .drawer-item:active { background: var(--bg); }
    .drawer-item.active { background: var(--blue-lt); }
    .drawer-item-icon { font-size: 1.3rem; flex-shrink: 0; width: 26px; text-align: center; }
    .drawer-item-body { flex: 1; }
    .drawer-item-title { font-size: .97rem; font-weight: 700; }
    .drawer-item-title.active-title { color: var(--blue); }
    .drawer-item-desc  { font-size: .75rem; color: var(--text-sec); margin-top: 2px; }
    .drawer-sep { height: 1px; background: var(--border); margin: 4px 20px; }

    /* ── 헤더 ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }
    .header-top {
      display: flex; align-items: center; gap: 8px;
      height: 56px;
    }
    .header-home-btn {
      display: flex; align-items: center; gap: 7px;
      text-decoration: none; color: var(--text-pri);
      -webkit-tap-highlight-color: transparent;
    }
    .header-home-icon { width: 28px; height: 28px; }
    .header-home-name { font-size: 1.1rem; font-weight: 900; letter-spacing: -.5px; }
    .header-page-title {
      flex: 1; text-align: center;
      font-size: 1rem; font-weight: 800; color: var(--text-pri);
    }
    .header-right { width: 42px; } /* 균형용 빈 공간 */

    /* ── 뒤로가기 버튼 (상세 뷰) ── */
    .btn-back {
      display: none; background: none; border: none; cursor: pointer;
      padding: 6px 4px; color: var(--text-sec); font-size: 1.4rem;
      flex-shrink: 0; line-height: 1;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── 목록 ── */
    .list-view { max-width: 600px; margin: 0 auto; padding: 16px 12px 80px; }

    .list-hero {
      background: linear-gradient(135deg,#1E40AF,#3B82F6);
      border-radius: var(--radius-lg); padding: 22px 20px; margin-bottom: 20px;
      color: #fff;
    }
    .list-hero-label { font-size: .78rem; font-weight: 700; opacity: .8; margin-bottom: 6px; }
    .list-hero-title { font-size: 1.3rem; font-weight: 900; line-height: 1.4; margin-bottom: 8px; }
    .list-hero-sub   { font-size: .85rem; opacity: .85; line-height: 1.6; }

    .post-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden;
      box-shadow: var(--shadow); margin-bottom: 12px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: box-shadow .15s, transform .15s;
    }
    .post-card:active { transform: scale(.99); box-shadow: none; }
    .post-card-bar  { height: 4px; width: 100%; }
    .post-card-body { padding: 14px 16px; }
    .post-card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .post-cat-badge {
      font-size: .72rem; font-weight: 700;
      padding: 3px 10px; border-radius: 50px;
      background: var(--blue-lt); color: var(--blue);
    }
    .post-date { font-size: .74rem; color: var(--text-ter); margin-left: auto; }
    .post-card-title {
      font-size: 1.05rem; font-weight: 800; line-height: 1.4;
      margin-bottom: 6px;
    }
    .post-card-summary {
      font-size: .85rem; color: var(--text-sec); line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .post-card-foot {
      padding: 10px 16px; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .post-card-author { font-size: .78rem; color: var(--text-ter); }
    .post-card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-left: auto; }
    .post-tag {
      font-size: .7rem; padding: 2px 8px; border-radius: 50px;
      background: var(--bg); color: var(--text-sec); border: 1px solid var(--border);
    }

    /* ── 상세 뷰 ── */
    .detail-view { display: none; max-width: 600px; margin: 0 auto; padding: 0 0 80px; }
    .detail-view.show { display: block; }
    .list-view.hide { display: none; }

    .detail-hero {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .detail-cat-badge {
      display: inline-block; font-size: .75rem; font-weight: 700;
      padding: 3px 12px; border-radius: 50px;
      background: var(--blue-lt); color: var(--blue);
      margin-bottom: 10px;
    }
    .detail-title {
      font-size: 1.3rem; font-weight: 900; line-height: 1.45;
      margin-bottom: 10px;
    }
    .detail-meta {
      font-size: .78rem; color: var(--text-ter);
      display: flex; align-items: center; gap: 10px;
    }
    .detail-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 12px; }

    /* ── 게시물 본문 스타일 ── */
    .post-content {
      padding: 20px 16px;
      font-size: .97rem; line-height: 1.8; color: var(--text-pri);
    }
    .post-content h3 {
      font-size: 1.05rem; font-weight: 800;
      margin: 24px 0 10px; color: var(--text-pri);
      padding-bottom: 6px; border-bottom: 2px solid var(--border);
    }
    .post-content h3:first-child { margin-top: 0; }
    .post-content p { margin-bottom: 12px; }
    .post-content ul { padding-left: 20px; margin-bottom: 12px; }
    .post-content ul ul { margin: 6px 0 0; }
    .post-content li { margin-bottom: 6px; }
    .post-content strong { font-weight: 800; }

    .post-tip {
      background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 10px;
      padding: 12px 14px; margin: 12px 0;
      font-size: .88rem; line-height: 1.7; color: #1E40AF;
    }
    .post-example {
      background: #F8F5FF; border: 1px solid #DDD6FE; border-radius: 10px;
      padding: 14px 16px; margin: 12px 0;
      font-size: .9rem; line-height: 1.7; color: var(--text-pri);
      font-style: italic;
    }
    .post-example-label {
      font-size: .72rem; font-weight: 800; color: var(--purple);
      letter-spacing: .5px; margin-bottom: 8px; font-style: normal;
    }
    .post-compare { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
    .post-compare-row {
      display: flex; flex-direction: column; gap: 4px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px;
    }
    .post-compare-before {
      font-size: .88rem; color: #DC2626;
      background: #FEF2F2; border-radius: 6px; padding: 6px 10px;
    }
    .post-compare-after {
      font-size: .88rem; color: #15803D;
      background: #F0FDF4; border-radius: 6px; padding: 6px 10px;
    }

    /* ── 댓글 섹션 ── */
    .comments-section {
      padding: 0 16px 20px;
      border-top: 6px solid var(--bg);
    }
    .comments-title {
      font-size: 1rem; font-weight: 800; margin: 18px 0 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .comments-count {
      font-size: .8rem; font-weight: 600; color: var(--text-ter);
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 2px 10px;
    }
    .comments-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .comment-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px;
    }
    .comment-card-head {
      display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    }
    .comment-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg,#60A5FA,#3B82F6);
      display: flex; align-items: center; justify-content: center;
      font-size: .8rem; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .comment-author { font-size: .88rem; font-weight: 700; }
    .comment-time   { font-size: .74rem; color: var(--text-ter); margin-left: auto; }
    .comment-body   { font-size: .9rem; line-height: 1.65; color: var(--text-pri); white-space: pre-wrap; word-break: break-word; }
    .comments-empty {
      text-align: center; padding: 24px; color: var(--text-ter);
      font-size: .9rem; background: var(--bg); border-radius: 12px;
      margin-bottom: 18px;
    }
    .comments-loading { text-align: center; padding: 20px; color: var(--text-ter); font-size: .88rem; }

    /* ── 댓글 작성 폼 ── */
    .comment-form-wrap {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 14px;
    }
    .comment-form-title { font-size: .88rem; font-weight: 700; margin-bottom: 10px; }
    .comment-form-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .comment-input-name {
      flex: 1; border: 1.5px solid var(--border); border-radius: 50px;
      padding: 9px 14px; font-size: .9rem; font-family: inherit;
      background: var(--bg); color: var(--text-pri); outline: none;
      transition: border-color .15s;
    }
    .comment-input-name:focus { border-color: var(--blue); background: var(--surface); }
    .comment-textarea {
      width: 100%; border: 1.5px solid var(--border); border-radius: 12px;
      padding: 10px 14px; font-size: .9rem; font-family: inherit;
      background: var(--bg); color: var(--text-pri); outline: none;
      resize: none; min-height: 72px; transition: border-color .15s;
    }
    .comment-textarea:focus { border-color: var(--blue); background: var(--surface); }
    .comment-textarea::placeholder, .comment-input-name::placeholder { color: var(--text-ter); }
    .btn-comment-submit {
      width: 100%; padding: 11px; border-radius: 50px;
      background: var(--blue); color: #fff; border: none;
      font-size: .95rem; font-weight: 800; font-family: inherit;
      cursor: pointer; transition: background .15s; margin-top: 8px;
    }
    .btn-comment-submit:hover { background: #1D4ED8; }
    .btn-comment-submit:disabled { background: var(--border); cursor: not-allowed; }
    .comment-notice { font-size: .75rem; color: var(--text-ter); margin-top: 8px; text-align: center; }

    /* ── 기타 ── */
    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--text-ter); font-size: .95rem;
    }
    .empty-icon { font-size: 2.5rem; display: block; margin-bottom: 12px; }
  </style>
</head>

<script>
const SUPABASE_URL = 'https://riomousxlyvwmembuhvc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_EULGblJ83IkmxLh9VMXnxQ_lcMgnmAh';

/* ── 드로어 ─────────────────────────────────────────── */
function openDrawer()  { document.getElementById('drawerOverlay').classList.add('show'); }
function closeDrawer() { document.getElementById('drawerOverlay').classList.remove('show'); }
document.getElementById('drawerOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('drawerOverlay')) closeDrawer();
});

/* ── 날짜 포맷 ─────────────────────────────────────── */
function fmtDate(str) {
  if (!str) return '';
  const d = new Date(str);
  if (isNaN(d)) return str;
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function fmtRelative(str) {
  const diff = Date.now() - new Date(str);
  if (diff < 60000)  return '방금 전';
  if (diff < 3600000) return `${Math.floor(diff/60000)}분 전`;
  if (diff < 86400000) return `${Math.floor(diff/3600000)}시간 전`;
  return fmtDate(str);
}

/* ── 목록 렌더 ─────────────────────────────────────── */
function renderList() {
  const posts = typeof POSTS_DATA !== 'undefined' ? POSTS_DATA : [];
  if (!posts.length) {
    document.getElementById('postList').innerHTML =
      '<div class="empty-state"><span class="empty-icon">📭</span>게시물이 없습니다.</div>';
    return;
  }
  document.getElementById('postList').innerHTML = posts.map(p => `
    <div class="post-card" onclick="openPost('${p.id}')">
      <div class="post-card-bar" style="background:${p.categoryColor||'#2563EB'}"></div>
      <div class="post-card-body">
        <div class="post-card-meta">
          <span class="post-cat-badge" style="background:${p.categoryColor}18;color:${p.categoryColor}">${p.category}</span>
          <span class="post-date">${fmtDate(p.date)}</span>
        </div>
        <div class="post-card-title">${p.title}</div>
        <div class="post-card-summary">${p.summary}</div>
      </div>
      <div class="post-card-foot">
        <span class="post-card-author">✍️ ${p.author}</span>
        <div class="post-card-tags">${(p.tags||[]).map(t=>`<span class="post-tag">#${t}</span>`).join('')}</div>
      </div>
    </div>
  `).join('');
}

/* ── 상세 열기 ─────────────────────────────────────── */
function openPost(id) {
  const post = (POSTS_DATA||[]).find(p => p.id === id);
  if (!post) return;

  // 헤더 업데이트
  document.getElementById('pageTitle').textContent = post.category;
  document.getElementById('btnBack').style.display = 'flex';

  // 뷰 전환
  document.getElementById('listView').classList.add('hide');
  const dv = document.getElementById('detailView');
  dv.classList.add('show');

  // 상세 헤로
  document.getElementById('detailHero').innerHTML = `
    <span class="detail-cat-badge" style="background:${post.categoryColor}18;color:${post.categoryColor}">${post.category}</span>
    <div class="detail-title">${post.title}</div>
    <div class="detail-meta">
      <span>✍️ ${post.author}</span>
      <span>📅 ${fmtDate(post.date)}</span>
    </div>
    <div class="detail-tags">${(post.tags||[]).map(t=>`<span class="post-tag">#${t}</span>`).join('')}</div>
  `;

  // 본문
  document.getElementById('postContent').innerHTML = post.content;

  // 댓글 섹션
  renderCommentsSection(post.id);

  // 스크롤 상단
  window.scrollTo({top: 0, behavior: 'instant'});

  // 해시 업데이트
  history.pushState({postId: id}, '', `#${id}`);
}

/* ── 뒤로가기 ──────────────────────────────────────── */
function goBack() {
  history.back();
}
window.addEventListener('popstate', e => {
  if (!location.hash) {
    showList();
  } else {
    const id = location.hash.slice(1);
    const post = (POSTS_DATA||[]).find(p => p.id === id);
    if (post) openPost(post.id);
  }
});
function showList() {
  document.getElementById('listView').classList.remove('hide');
  document.getElementById('detailView').classList.remove('show');
  document.getElementById('pageTitle').textContent = '정보게시판';
  document.getElementById('btnBack').style.display = 'none';
  window.scrollTo({top: 0, behavior: 'instant'});
}

/* ── 댓글 섹션 렌더 ─────────────────────────────────── */
function renderCommentsSection(postId) {
  const sec = document.getElementById('commentsSection');
  sec.innerHTML = `
    <div class="comments-title">
      💬 댓글 <span class="comments-count" id="commentCount">불러오는 중…</span>
    </div>
    <div id="commentsList"><div class="comments-loading">댓글을 불러오는 중…</div></div>
    <div class="comment-form-wrap">
      <div class="comment-form-title">댓글 남기기</div>
      <div class="comment-form-row">
        <input class="comment-input-name" id="cAuthor" maxlength="20" placeholder="닉네임 (선택)" />
      </div>
      <textarea class="comment-textarea" id="cContent" maxlength="500" rows="3"
        placeholder="궁금한 점이나 도움이 됐던 경험을 남겨주세요. (최대 500자)"></textarea>
      <button class="btn-comment-submit" id="cSubmit" onclick="submitComment('${postId}')">댓글 달기</button>
      <div class="comment-notice">욕설·광고 댓글은 삭제될 수 있습니다.</div>
    </div>
  `;
  loadComments(postId);
}

/* ── 댓글 불러오기 ──────────────────────────────────── */
async function loadComments(postId) {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/post_comments?post_id=eq.${encodeURIComponent(postId)}&order=created_at.asc&select=id,author_name,content,created_at`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    if (!res.ok) throw new Error(res.status);
    const rows = await res.json();
    renderCommentList(rows);
  } catch (e) {
    document.getElementById('commentsList').innerHTML =
      '<div class="comments-empty">댓글을 불러오지 못했습니다.<br><small>잠시 후 다시 시도해 주세요.</small></div>';
    document.getElementById('commentCount').textContent = '0';
  }
}

function renderCommentList(rows) {
  document.getElementById('commentCount').textContent = rows.length;
  if (!rows.length) {
    document.getElementById('commentsList').innerHTML =
      '<div class="comments-empty">첫 번째 댓글을 남겨주세요! 😊</div>';
    return;
  }
  document.getElementById('commentsList').innerHTML =
    `<div class="comments-list">${rows.map(r => {
      const name  = (r.author_name || '익명').trim() || '익명';
      const initials = name.slice(0,1);
      return `
        <div class="comment-card">
          <div class="comment-card-head">
            <div class="comment-avatar">${initials}</div>
            <span class="comment-author">${escHtml(name)}</span>
            <span class="comment-time">${fmtRelative(r.created_at)}</span>
          </div>
          <div class="comment-body">${escHtml(r.content)}</div>
        </div>`;
    }).join('')}</div>`;
}

/* ── 댓글 제출 ──────────────────────────────────────── */
async function submitComment(postId) {
  const author  = document.getElementById('cAuthor').value.trim() || '익명';
  const content = document.getElementById('cContent').value.trim();
  if (!content) { alert('댓글 내용을 입력해 주세요.'); return; }
  if (content.length > 500) { alert('댓글은 500자 이내로 입력해 주세요.'); return; }

  const btn = document.getElementById('cSubmit');
  btn.disabled = true;
  btn.textContent = '등록 중…';

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/post_comments`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ post_id: postId, author_name: author, content })
    });
    if (!res.ok) throw new Error(res.status);
    document.getElementById('cContent').value = '';
    await loadComments(postId);
  } catch (e) {
    alert('댓글 등록에 실패했습니다. 잠시 후 다시 시도해 주세요.');
  } finally {
    btn.disabled = false;
    btn.textContent = '댓글 달기';
  }
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── 초기화 ─────────────────────────────────────────── */
function init() {
  renderList();
  const hash = location.hash.slice(1);
  if (hash) {
    const post = (POSTS_DATA||[]).find(p => p.id === hash);
    if (post) { openPost(post.id); return; }
  }
}
init();
</script>
</body>
</html>
