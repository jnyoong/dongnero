stages:
  - crawl

daily_crawl:
  stage: crawl
  image: python:3.11-slim
  script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet requests beautifulsoup4
    - python crawler.py
    - git config user.email "ci@dongnero.kr"
    - git config user.name "Dongnero CI"
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@gitlab.com/kahn201130/dongnero.git"

    # 크롤러가 생성하는 파일 전부 스테이징
    - git add jobs_data.js jobs.json excluded_data.js

    - |
      if git diff --cached --quiet; then
        echo "변경 없음 — 스킵"
      else
        git commit -m "daily update $(date '+%Y-%m-%d')"
        # --autostash: 스테이징되지 않은 파일이 있어도 rebase 가능
        git pull --rebase --autostash origin $CI_COMMIT_BRANCH
        git push origin HEAD:$CI_COMMIT_BRANCH
        echo "✅ GitLab push 완료"
      fi

    # GitHub 미러 push (GITHUB_TOKEN 설정 시 자동 실행)
    - |
      if [ -n "${GITHUB_TOKEN}" ]; then
        git remote add github "https://${GITHUB_TOKEN}@github.com/jnyoong/dongnero.git" 2>/dev/null || \
          git remote set-url github "https://${GITHUB_TOKEN}@github.com/jnyoong/dongnero.git"
        git push github HEAD:main
        echo "✅ GitHub push 완료"
      else
        echo "⚠️ GITHUB_TOKEN 미설정 — GitLab CI/CD 변수에 추가 필요"
      fi

  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
