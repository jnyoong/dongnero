  '충남':['천안시','공주시','보령시','아산시','서산시','논산시','계룡시','당진시','금산군','부여군','서천군','청양군','홍성군','예산군','태안군'],

const REGION_MAP = [
  ['서울','서울'],['부산','부산'],['대구','대구'],['인천','인천'],
  ['광주','광주'],['대전','대전'],['울산','울산'],['세종','세종'],
  ['경기','경기'],['강원','강원'],['충북','충북'],['충남','충남'],
  ['전북','전북'],['전남','전남'],['경북','경북'],['경남','경남'],['제주','제주'],
];
const INDUSTRY_MAP = [
  { keys:['요양','보호사','돌봄','케어','방문요양','재가'],  label:'요양·돌봄' },
  { keys:['경비','보안','주차관리'],                        label:'경비·보안' },
  { keys:['미화','청소','환경미화'],                        label:'청소·미화' },
  { keys:['조리','급식','주방','요리','조리원'],             label:'조리·급식' },
  { keys:['복지사','사회복지','상담원','복지관'],            label:'복지·상담' },
  { keys:['사무','행정','총무','관리직','사무보조'],         label:'사무·행정' },
  { keys:['농업','농산물','재배','텃밭'],                   label:'농업·생산' },
  { keys:['강사','교육','지도사','선생'],                   label:'교육·지도' },
  { keys:['판매','영업','매장'],                            label:'판매·영업' },
  { keys:['시설','건설','설비','전기','기계'],               label:'시설·건설' },
  { keys:['간호','의료','약사'],                            label:'의료·보건' },
];

function getRegion(loc) {
  for (const [k,v] of REGION_MAP) if ((loc||'').includes(k)) return v;
  return '기타';
}
function getIndustry(title, desc) {
  const t = (title||'') + ' ' + (desc||'');
  for (const ind of INDUSTRY_MAP) if (ind.keys.some(k => t.includes(k))) return ind.label;
  return '기타';
}
function dlChip(dl) {
  if (!dl) return `<span class="dl-chip dl-etc">미정</span>`;
  if (dl === '상시모집') return `<span class="dl-chip dl-ok">상시모집</span>`;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dl);
  const days = Math.ceil((d - today) / 86400000);
  const fmt = dl.replace(/-/g,'.');
  if (days < 0)   return `<span class="dl-chip dl-etc">마감</span>`;
  if (days === 0) return `<span class="dl-chip dl-urgent">오늘마감!</span>`;
  if (days <= 3)  return `<span class="dl-chip dl-urgent">D-${days} ${fmt}</span>`;
  if (days <= 7)  return `<span class="dl-chip dl-soon">D-${days} ${fmt}</span>`;
  return `<span class="dl-chip dl-ok">D-${days} ${fmt}</span>`;
}

function onSidoChange() {
  const sido = document.getElementById('sidoSel').value;
  const guSel = document.getElementById('guSel');
  guSel.innerHTML = '<option value="">구/군/시 선택</option>';
  if (sido && DISTRICTS[sido]) {
    DISTRICTS[sido].forEach(d => {
      const opt = document.createElement('option');
      opt.value = d; opt.textContent = d;
      guSel.appendChild(opt);
    });
    guSel.disabled = false;
  } else {
    guSel.disabled = true;
  }
}

function search() {
  const sido = document.getElementById('sidoSel').value;
  const gu   = document.getElementById('guSel').value;
  if (!sido) { alert('시/도를 선택해 주세요.'); return; }

  if (typeof JOBS_DATA === 'undefined') {
    document.getElementById('resultWrap').innerHTML =
      '<div class="empty"><span class="empty-icon">⚠️</span>데이터를 불러올 수 없습니다.</div>';
    return;
  }

  const allJobs = Array.isArray(JOBS_DATA) ? JOBS_DATA : (JOBS_DATA.jobs || []);
  const keyword = gu || sido;

  const jobs = allJobs.filter(j => (j.location || '').includes(keyword));

  const wrap = document.getElementById('resultWrap');

  if (!jobs.length) {
    wrap.innerHTML = `
      <div class="result-bar">
        <span class="district-badge">📍 ${sido} ${gu}</span>
      </div>
      <div class="empty">
        <span class="empty-icon">🔍</span>
        <span>${sido} ${gu} 지역 공고가 없습니다.<br>시/도만 선택하거나 다른 지역을 찾아보세요.</span>
      </div>`;
    return;
  }

  jobs.sort((a,b) => {
    const da = /^\d{4}-\d{2}-\d{2}$/.test(a.deadline) ? a.deadline : '9999-12-31';
    const db = /^\d{4}-\d{2}-\d{2}$/.test(b.deadline) ? b.deadline : '9999-12-31';
    return da.localeCompare(db);
  });

  const cards = jobs.map(job => {
    const region   = getRegion(job.location || '');
    const industry = getIndustry(job.title, job.description);
    const typeClass = ['정규직','계약직','시간제'].includes(job.type) ? job.type : '기타';
    const salRow = job.salary
      ? `<div class="info-row"><span class="info-icon">💰</span><span class="info-text salary">${job.salary.replace(/\s+/g,' ').trim()}</span></div>` : '';
    const link   = job.apply_link || '#';
    const target = job.apply_link ? 'target="_blank" rel="noopener"' : '';
    return `
    <div class="card">
      <div class="card-top-bar line-${job.source||'기타'}"></div>
      <div class="card-inner">
        <div class="card-meta">
          <div class="tag-row">
            <span class="tag tag-region">${region}</span>
            <span class="tag tag-industry">${industry}</span>
            <span class="tag tag-${typeClass}">${job.type||'미기재'}</span>
          </div>
          <span class="source-badge src-${job.source||'기타'}">${job.source||''}</span>
        </div>
        <div class="card-title">${job.title}</div>
        <div class="card-company">🏢 ${job.company||'회사명 미공개'}</div>
        <div class="info-rows">
          <div class="info-row"><span class="info-icon">📍</span><span class="info-text">${job.location||'위치 미공개'}</span></div>
          ${salRow}
          <div class="info-row"><span class="info-icon">📅</span><span class="info-text">${dlChip(job.deadline)}</span></div>
        </div>
      </div>
      <div class="card-foot">
        <a class="btn-view" href="${link}" ${target}>공고 보기 →</a>
      </div>
    </div>`;
  }).join('');

  wrap.innerHTML = `
    <div id="directSlot"></div>
    <div class="result-bar">
      <span class="result-count"><strong>${jobs.length}</strong>건의 공고</span>
      <span class="district-badge">📍 ${sido} ${gu || '전체'}</span>
    </div>
    ${cards}`;

  loadDirectJobsLocal(sido, gu);
}

const SB_URL = 'https://riomousxlyvwmembuhvc.supabase.co';
const SB_KEY = 'sb_publishable_EULGblJ83IkmxLh9VMXnxQ_lcMgnmAh';

async function loadDirectJobsLocal(sido, gu) {
  const slot = document.getElementById('directSlot');
  if (!slot) return;
  try {
    const res = await fetch(`${SB_URL}/rest/v1/company_jobs?status=eq.approved&select=*`, {
      headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
    });
    if (!res.ok) return;
    const data = await res.json();
    const keyword = gu || sido;
    const matching = data.filter(j => {
      const fullLoc = [j.location_sido, j.location_gu, j.location_detail].filter(Boolean).join(' ');
      return fullLoc.includes(keyword) || j.location_sido === sido;
    });
    if (!matching.length) return;
    const directCards = matching.map(j => {
      const fullLoc = [j.location_sido, j.location_gu, j.location_detail].filter(Boolean).join(' ');
      const industry = getIndustry(j.job_title, j.job_description);
      const typeClass = ['정규직','계약직','시간제'].includes(j.employment_type) ? j.employment_type : '기타';
      const salRow = j.salary
        ? `<div class="info-row"><span class="info-icon">💰</span><span class="info-text salary">${j.salary}</span></div>` : '';
      const footBtn = j.website
        ? `<a class="btn-view" href="${j.website}" target="_blank" rel="noopener">공고 보기 →</a>`
        : `<a class="btn-view" href="company-job-form.html">문의하기 →</a>`;
      return `
      <div class="card card-direct">
        <div class="direct-cert-bar">
          <span class="dongnero-cert"> 동네로 인증</span>
          <span class="direct-label">직접등록</span>
        </div>
        <div class="card-inner">
          <div class="card-meta">
            <div class="tag-row">
              <span class="tag tag-region">${getRegion(j.location_sido)}</span>
              <span class="tag tag-industry">${industry}</span>
              ${j.employment_type ? `<span class="tag tag-${typeClass}">${j.employment_type}</span>` : ''}
            </div>
            <span class="source-badge" style="background:#DBEAFE;color:#1D4ED8">동네로</span>
          </div>
          <div class="card-title">${j.job_title}</div>
          <div class="card-company">🏢 ${j.company_name}</div>
          <div class="info-rows">
            <div class="info-row">
              <span class="info-icon">📍</span>
              <span class="info-text">${fullLoc || j.location_sido}</span>
            </div>
            ${salRow}
            <div class="info-row">
              <span class="info-icon">📅</span>
              <span class="info-text">${dlChip(j.deadline)}</span>
            </div>
          </div>
          <div class="info-text" style="font-size:.8rem;margin-top:4px">${(j.job_description||'').slice(0,80)}${(j.job_description||'').length>80?'…':''}</div>
        </div>
        <div class="card-foot">${footBtn}</div>
      </div>`;
    }).join('');

    const existingCount = wrap.querySelector('.result-count strong');
    if (existingCount) {
      existingCount.textContent = parseInt(existingCount.textContent) + matching.length;
    }
    slot.innerHTML = `<div class="direct-section-label">📌 동네로 인증 공고 ${matching.length}건</div>${directCards}<div class="crawl-section-label">전국 크롤링 공고</div>`;
  } catch (e) {
    console.error('직접공고 로드 실패:', e);
  }
}
