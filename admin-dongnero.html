<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 — 동네로</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Malgun Gothic', system-ui, sans-serif; background: #F7F8FA; color: #111827; min-height: 100vh; }

    /* 로그인 */
    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: #fff; border: 1px solid #E2E5EA; border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .login-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 6px; }
    .login-sub   { font-size: .88rem; color: #6B7280; margin-bottom: 28px; }
    .login-input { width: 100%; border: 1.5px solid #E2E5EA; border-radius: 10px; padding: 13px 16px; font-size: 1rem; font-family: inherit; outline: none; margin-bottom: 14px; transition: border-color .15s; }
    .login-input:focus { border-color: #2563EB; }
    .login-btn { width: 100%; background: #2563EB; color: #fff; border: none; border-radius: 10px; padding: 13px; font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit; }
    .login-err { font-size: .85rem; color: #DC2626; margin-top: 10px; display: none; }

    /* 관리자 */
    .admin-wrap { display: none; max-width: 1300px; margin: 0 auto; padding: 24px 20px 60px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .admin-title { font-size: 1.4rem; font-weight: 800; }
    .admin-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn { border: none; border-radius: 8px; padding: 8px 16px; font-size: .88rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: background .15s; }
    .btn-blue   { background: #2563EB; color: #fff; }
    .btn-green  { background: #059669; color: #fff; }
    .btn-gray   { background: #F3F4F6; color: #374151; }
    .btn-gray:hover { background: #E5E7EB; }

    /* 탭 */
    .tabs { display: flex; gap: 0; border-bottom: 2px solid #E2E5EA; margin-bottom: 20px; }
    .tab { padding: 10px 22px; font-size: .95rem; font-weight: 700; cursor: pointer; color: #6B7280; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all .15s; white-space: nowrap; }
    .tab.active { color: #2563EB; border-bottom-color: #2563EB; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* 요약 칩 */
    .summary-row { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .summary-chip { background: #fff; border: 1px solid #E2E5EA; border-radius: 10px; padding: 12px 18px; font-size: .85rem; color: #6B7280; }
    .summary-chip strong { font-size: 1.3rem; color: #111827; display: block; }
    .summary-chip.warn strong { color: #DC2626; }

    /* 검색/필터 바 */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .filter-bar input, .filter-bar select {
      border: 1.5px solid #E2E5EA; border-radius: 8px;
      padding: 8px 12px; font-size: .88rem; font-family: inherit;
      outline: none; background: #fff; transition: border-color .15s;
    }
    .filter-bar input { flex: 1; min-width: 180px; }
    .filter-bar input:focus, .filter-bar select:focus { border-color: #2563EB; }

    /* 테이블 */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 8px rgba(0,0,0,.06); font-size: .85rem; }
    thead { background: #F9FAFB; position: sticky; top: 0; }
    th { padding: 10px 14px; text-align: left; font-size: .78rem; font-weight: 700; color: #6B7280; border-bottom: 1px solid #E2E5EA; white-space: nowrap; cursor: pointer; user-select: none; }
    th:hover { color: #2563EB; }
    td { padding: 8px 14px; color: #111827; border-bottom: 1px solid #F3F4F6; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #F9FAFB; }
    td a { color: #2563EB; text-decoration: none; font-size: .78rem; }
    td a:hover { text-decoration: underline; }

    .badge { display: inline-block; border-radius: 5px; padding: 2px 7px; font-size: .74rem; font-weight: 700; white-space: nowrap; }
    .badge-blue   { background: #EFF6FF; color: #2563EB; }
    .badge-orange { background: #FFF4EE; color: #EA580C; }
    .badge-green  { background: #F0FDF4; color: #15803D; }
    .badge-purple { background: #F5F3FF; color: #7C3AED; }
    .badge-red    { background: #FEF2F2; color: #DC2626; }
    .badge-gray   { background: #F3F4F6; color: #6B7280; }

    .empty-msg { text-align: center; padding: 48px; color: #9CA3AF; }
    .loading   { text-align: center; padding: 48px; color: #6B7280; }
    .row-num   { color: #9CA3AF; font-size: .78rem; }
    .title-cell { max-width: 280px; }
    .title-text { font-weight: 600; line-height: 1.35; }
    .company-text { font-size: .78rem; color: #6B7280; margin-top: 2px; }
    .reason-cell { color: #DC2626; font-size: .8rem; font-weight: 600; }
  </style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-title">🔐 관리자 로그인</div>
    <div class="login-sub">동네로 관리 페이지</div>
    <input class="login-input" type="password" id="pwInput" placeholder="비밀번호 입력" autocomplete="current-password" />
    <button class="login-btn" id="loginBtn">로그인</button>
    <div class="login-err" id="loginErr">비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<div class="admin-wrap" id="adminWrap">
  <div class="admin-header">
    <div class="admin-title">⚙️ 동네로 관리자</div>
    <div class="admin-actions">
      <button class="btn btn-blue"  id="btnRefresh">새로고침</button>
      <button class="btn btn-green" id="btnCsv">CSV 다운로드</button>
      <button class="btn btn-gray"  id="btnLogout">로그아웃</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="signups">📋 알림 신청 <span id="tabSignupCount"></span></div>
    <div class="tab" data-tab="jobs">📰 공고 목록 <span id="tabJobCount"></span></div>
    <div class="tab" data-tab="excluded">🚫 필터링 제외 <span id="tabExCount"></span></div>
  </div>

  <!-- 탭1: 알림 신청 -->
  <div class="tab-panel active" id="panel-signups">
    <div class="summary-row">
      <div class="summary-chip"><strong id="totalCount">-</strong>총 신청</div>
      <div class="summary-chip"><strong id="todayCount">-</strong>오늘 신청</div>
      <div class="summary-chip"><strong id="lastDate">-</strong>최근 신청일</div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>#</th><th>전화번호</th><th>나이</th><th>일자리 유형</th><th>선호 지역</th><th>신청일시</th>
        </tr></thead>
        <tbody id="signupBody"><tr><td colspan="6" class="loading">불러오는 중…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- 탭2: 공고 목록 -->
  <div class="tab-panel" id="panel-jobs">
    <div class="summary-row">
      <div class="summary-chip"><strong id="jobTotal">-</strong>전체 공고</div>
      <div class="summary-chip"><strong id="jobUpdated">-</strong>업데이트</div>
    </div>
    <div class="filter-bar">
      <input type="text" id="jobSearch" placeholder="제목·회사·지역 검색…" oninput="renderJobs()">
      <select id="jobSource" onchange="renderJobs()">
        <option value="">출처 전체</option>
        <option>고용24</option><option>알바몬</option><option>알바천국</option><option>시니어로</option>
      </select>
      <select id="jobType" onchange="renderJobs()">
        <option value="">유형 전체</option>
        <option>정규직</option><option>계약직</option><option>시간제</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>#</th>
          <th>제목 / 회사</th>
          <th>지역</th>
          <th>유형</th>
          <th>급여</th>
          <th>출처</th>
          <th>마감일</th>
          <th>링크</th>
        </tr></thead>
        <tbody id="jobBody"><tr><td colspan="8" class="loading">공고 데이터 로딩 중…</td></tr></tbody>
      </table>
    </div>
    <div style="margin-top:10px;font-size:.8rem;color:#9CA3AF" id="jobRangeInfo"></div>
  </div>

  <!-- 탭3: 필터링 제외 -->
  <div class="tab-panel" id="panel-excluded">
    <div class="summary-row">
      <div class="summary-chip warn"><strong id="exTotal">-</strong>제외된 공고</div>
      <div class="summary-chip"><strong id="exUpdated">-</strong>업데이트</div>
    </div>
    <div class="filter-bar">
      <input type="text" id="exSearch" placeholder="제목·회사 검색…" oninput="renderExcluded()">
      <select id="exReason" onchange="renderExcluded()">
        <option value="">제외 이유 전체</option>
        <option value="업체명">업체명</option>
        <option value="키워드">키워드</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>#</th>
          <th>제목 / 회사</th>
          <th>지역</th>
          <th>출처</th>
          <th>제외 이유</th>
          <th>링크</th>
        </tr></thead>
        <tbody id="exBody"><tr><td colspan="6" class="loading">필터 데이터 로딩 중…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="jobs_data.js"></script>
<script src="excluded_data.js"></script>
<script>
const SUPABASE_URL = 'https://riomousxlyvwmembuhvc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_EULGblJ83IkmxLh9VMXnxQ_lcMgnmAh';
const ADMIN_PW     = 'dongnero2024';

let allSignups = [], allJobs = [], allExcluded = [];
let jobPage = 1;
const JOB_PER_PAGE = 200;

/* ── 로그인 ── */
function tryLogin() {
  if (document.getElementById('pwInput').value === ADMIN_PW) {
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('adminWrap').style.display = 'block';
    loadSignups();
    loadJobData();
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
}
document.getElementById('loginBtn').addEventListener('click', tryLogin);
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
document.getElementById('btnLogout').addEventListener('click', () => location.reload());

/* ── 탭 전환 ── */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

/* ── 알림 신청 로드 ── */
async function loadSignups() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/notify_signups?select=*&order=created_at.desc`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    allSignups = await res.json();
    renderSignups();
    renderSignupSummary();
    document.getElementById('tabSignupCount').textContent = `(${allSignups.length})`;
  } catch(e) {
    document.getElementById('signupBody').innerHTML = '<tr><td colspan="6" class="empty-msg">불러오기 실패</td></tr>';
  }
}

function renderSignups() {
  if (!allSignups.length) {
    document.getElementById('signupBody').innerHTML = '<tr><td colspan="6" class="empty-msg">신청 내역이 없습니다.</td></tr>';
    return;
  }
  document.getElementById('signupBody').innerHTML = allSignups.map((row, i) => {
    const dt = new Date(row.created_at);
    const dateStr = dt.toLocaleDateString('ko-KR') + ' ' + dt.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
    const loc = [row.preferred_region, row.preferred_district].filter(Boolean).join(' ') || row.region || '전체';
    return `<tr>
      <td class="row-num">${allSignups.length - i}</td>
      <td>${row.phone || '-'}</td>
      <td>${row.age || '-'}세</td>
      <td>${row.job_types || '-'}</td>
      <td><span class="badge badge-blue">${loc}</span></td>
      <td>${dateStr}</td>
    </tr>`;
  }).join('');
}

function renderSignupSummary() {
  document.getElementById('totalCount').textContent = allSignups.length;
  const today = new Date().toLocaleDateString('ko-KR');
  document.getElementById('todayCount').textContent = allSignups.filter(r => new Date(r.created_at).toLocaleDateString('ko-KR') === today).length;
  if (allSignups.length) document.getElementById('lastDate').textContent = new Date(allSignups[0].created_at).toLocaleDateString('ko-KR');
}

/* ── 공고 데이터 로드 ── */
function loadJobData() {
  if (typeof JOBS_DATA !== 'undefined') {
    allJobs = JOBS_DATA.jobs || [];
    document.getElementById('jobTotal').textContent = allJobs.length.toLocaleString();
    document.getElementById('jobUpdated').textContent = JOBS_DATA.updated_at || '-';
    document.getElementById('tabJobCount').textContent = `(${allJobs.length.toLocaleString()})`;
    renderJobs();
  }
  if (typeof EXCLUDED_DATA !== 'undefined' && EXCLUDED_DATA.updated_at) {
    allExcluded = EXCLUDED_DATA.jobs || [];
    document.getElementById('exTotal').textContent = allExcluded.length;
    document.getElementById('exUpdated').textContent = EXCLUDED_DATA.updated_at || '-';
    document.getElementById('tabExCount').textContent = `(${allExcluded.length})`;
    renderExcluded();
  } else {
    document.getElementById('exBody').innerHTML =
      '<tr><td colspan="6" class="empty-msg">⚙️ Actions에서 크롤러를 한 번 실행하면 데이터가 생성됩니다.</td></tr>';
    document.getElementById('exTotal').textContent = '미생성';
  }
}

function srcBadge(src) {
  const map = { '고용24':'badge-blue', '알바몬':'badge-orange', '알바천국':'badge-green', '시니어로':'badge-purple' };
  return `<span class="badge ${map[src]||'badge-gray'}">${src||''}</span>`;
}
function typeBadge(t) {
  const map = { '정규직':'badge-green', '계약직':'badge-orange', '시간제':'badge-purple' };
  return t ? `<span class="badge ${map[t]||'badge-gray'}">${t}</span>` : '-';
}

function renderJobs() {
  const kw  = document.getElementById('jobSearch').value.trim().toLowerCase();
  const src = document.getElementById('jobSource').value;
  const typ = document.getElementById('jobType').value;

  let list = allJobs.filter(j => {
    if (src && j.source !== src) return false;
    if (typ && j.type !== typ) return false;
    if (kw && !(j.title + j.company + j.location).toLowerCase().includes(kw)) return false;
    return true;
  });

  document.getElementById('jobRangeInfo').textContent = `${list.length.toLocaleString()}건 표시`;

  if (!list.length) {
    document.getElementById('jobBody').innerHTML = '<tr><td colspan="8" class="empty-msg">검색 결과가 없습니다.</td></tr>';
    return;
  }

  document.getElementById('jobBody').innerHTML = list.map((j, i) => `
    <tr>
      <td class="row-num">${i + 1}</td>
      <td class="title-cell">
        <div class="title-text">${j.title}</div>
        <div class="company-text">${j.company || '-'}</div>
      </td>
      <td>${j.location || '-'}</td>
      <td>${typeBadge(j.type)}</td>
      <td style="font-size:.78rem;white-space:nowrap">${j.salary || '-'}</td>
      <td>${srcBadge(j.source)}</td>
      <td style="white-space:nowrap;font-size:.8rem">${j.deadline || '-'}</td>
      <td>${j.apply_link ? `<a href="${j.apply_link}" target="_blank">보기↗</a>` : '-'}</td>
    </tr>`).join('');
}

function renderExcluded() {
  const kw  = document.getElementById('exSearch').value.trim().toLowerCase();
  const rsn = document.getElementById('exReason').value;

  let list = allExcluded.filter(j => {
    if (rsn && !(j._exclude_reason || '').startsWith(rsn)) return false;
    if (kw && !(j.title + j.company).toLowerCase().includes(kw)) return false;
    return true;
  });

  if (!list.length) {
    document.getElementById('exBody').innerHTML = '<tr><td colspan="6" class="empty-msg">제외된 공고가 없습니다.</td></tr>';
    return;
  }

  document.getElementById('exBody').innerHTML = list.map((j, i) => `
    <tr>
      <td class="row-num">${i + 1}</td>
      <td class="title-cell">
        <div class="title-text">${j.title}</div>
        <div class="company-text">${j.company || '-'}</div>
      </td>
      <td>${j.location || '-'}</td>
      <td>${srcBadge(j.source)}</td>
      <td class="reason-cell">${j._exclude_reason || '-'}</td>
      <td>${j.apply_link ? `<a href="${j.apply_link}" target="_blank">보기↗</a>` : '-'}</td>
    </tr>`).join('');
}

/* ── CSV ── */
document.getElementById('btnCsv').addEventListener('click', () => {
  if (!allSignups.length) { alert('데이터가 없습니다.'); return; }
  const header = ['번호','전화번호','나이','일자리유형','선호지역','신청일시'];
  const rows = allSignups.map((r, i) => {
    const loc = [r.preferred_region, r.preferred_district].filter(Boolean).join(' ') || r.region || '전체';
    return [allSignups.length - i, r.phone||'', r.age||'', r.job_types||'', loc, new Date(r.created_at).toLocaleString('ko-KR')];
  });
  const csv = [header, ...rows].map(r => r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' }));
  a.download = `알림신청_${new Date().toLocaleDateString('ko-KR').replace(/\. /g,'-').replace('.','')}.csv`;
  a.click();
});

document.getElementById('btnRefresh').addEventListener('click', () => { loadSignups(); loadJobData(); });
</script>
</body>
</html>
