<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 — 알림 신청 내역</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Malgun Gothic', system-ui, sans-serif;
      background: #F7F8FA; color: #111827; min-height: 100vh;
    }

    /* 로그인 화면 */
    .login-wrap {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .login-box {
      background: #fff; border: 1px solid #E2E5EA;
      border-radius: 16px; padding: 40px 36px;
      width: 100%; max-width: 360px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .login-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 6px; }
    .login-sub   { font-size: .88rem; color: #6B7280; margin-bottom: 28px; }
    .login-input {
      width: 100%; border: 1.5px solid #E2E5EA; border-radius: 10px;
      padding: 13px 16px; font-size: 1rem; font-family: inherit;
      outline: none; margin-bottom: 14px; transition: border-color .15s;
    }
    .login-input:focus { border-color: #2563EB; }
    .login-btn {
      width: 100%; background: #2563EB; color: #fff;
      border: none; border-radius: 10px; padding: 13px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: background .15s;
    }
    .login-btn:hover { background: #1D4ED8; }
    .login-err { font-size: .85rem; color: #DC2626; margin-top: 10px; display: none; }

    /* 관리자 화면 */
    .admin-wrap { display: none; padding: 32px 24px 60px; max-width: 1100px; margin: 0 auto; }
    .admin-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .admin-title { font-size: 1.4rem; font-weight: 800; }
    .admin-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      border: none; border-radius: 8px; padding: 9px 18px;
      font-size: .9rem; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: background .15s;
    }
    .btn-csv  { background: #059669; color: #fff; }
    .btn-csv:hover  { background: #047857; }
    .btn-refresh { background: #2563EB; color: #fff; }
    .btn-refresh:hover { background: #1D4ED8; }
    .btn-logout { background: #F3F4F6; color: #374151; }
    .btn-logout:hover { background: #E5E7EB; }

    .summary-row {
      display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .summary-chip {
      background: #fff; border: 1px solid #E2E5EA; border-radius: 10px;
      padding: 14px 20px; font-size: .9rem; color: #6B7280;
    }
    .summary-chip strong { font-size: 1.4rem; color: #111827; display: block; }

    .table-wrap { overflow-x: auto; }
    table {
      width: 100%; border-collapse: collapse;
      background: #fff; border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 8px rgba(0,0,0,.06);
    }
    thead { background: #F9FAFB; }
    th {
      padding: 13px 16px; text-align: left;
      font-size: .82rem; font-weight: 700; color: #6B7280;
      border-bottom: 1px solid #E2E5EA; white-space: nowrap;
    }
    td {
      padding: 13px 16px; font-size: .9rem; color: #111827;
      border-bottom: 1px solid #F3F4F6;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #F9FAFB; }

    .region-tag {
      display: inline-block; background: #EFF6FF; color: #2563EB;
      border-radius: 6px; padding: 2px 8px; font-size: .78rem; font-weight: 700;
    }
    .empty-msg { text-align: center; padding: 48px; color: #9CA3AF; font-size: 1rem; }
    .loading   { text-align: center; padding: 48px; color: #6B7280; }
  </style>
</head>
<body>

<!-- 로그인 -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-title">🔐 관리자 로그인</div>
    <div class="login-sub">동네로 알림 신청 관리 페이지</div>
    <input class="login-input" type="password" id="pwInput"
           placeholder="비밀번호 입력" autocomplete="current-password" />
    <button class="login-btn" id="loginBtn">로그인</button>
    <div class="login-err" id="loginErr">비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<!-- 관리자 화면 -->
<div class="admin-wrap" id="adminWrap">
  <div class="admin-header">
    <div class="admin-title">📋 알림 신청 내역</div>
    <div class="admin-actions">
      <button class="btn btn-refresh" id="btnRefresh">새로고침</button>
      <button class="btn btn-csv"     id="btnCsv">CSV 다운로드</button>
      <button class="btn btn-logout"  id="btnLogout">로그아웃</button>
    </div>
  </div>

  <div class="summary-row">
    <div class="summary-chip"><strong id="totalCount">-</strong>총 신청 수</div>
    <div class="summary-chip"><strong id="todayCount">-</strong>오늘 신청</div>
    <div class="summary-chip"><strong id="lastDate">-</strong>최근 신청일</div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>전화번호</th>
          <th>나이</th>
          <th>일자리 유형</th>
          <th>선호 지역</th>
          <th>신청일시</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="5" class="loading">불러오는 중…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://riomousxlyvwmembuhvc.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_EULGblJ83IkmxLh9VMXnxQ_lcMgnmAh';
  const ADMIN_PW     = 'dongnero2024';  // ← 비밀번호 여기서 변경

  const loginWrap = document.getElementById('loginWrap');
  const adminWrap = document.getElementById('adminWrap');
  let allData = [];

  /* ── 로그인 ── */
  function tryLogin() {
    const val = document.getElementById('pwInput').value;
    if (val === ADMIN_PW) {
      loginWrap.style.display = 'none';
      adminWrap.style.display = 'block';
      loadData();
    } else {
      document.getElementById('loginErr').style.display = 'block';
    }
  }
  document.getElementById('loginBtn').addEventListener('click', tryLogin);
  document.getElementById('pwInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryLogin();
  });
  document.getElementById('btnLogout').addEventListener('click', () => {
    location.reload();
  });

  /* ── 데이터 로드 ── */
  async function loadData() {
    document.getElementById('tableBody').innerHTML =
      '<tr><td colspan="5" class="loading">불러오는 중…</td></tr>';
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/notify_signups?select=*&order=created_at.desc`,
        {
          headers: {
            'apikey':        SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY
          }
        }
      );
      allData = await res.json();
      renderTable(allData);
      renderSummary(allData);
    } catch(e) {
      document.getElementById('tableBody').innerHTML =
        '<tr><td colspan="5" class="empty-msg">데이터를 불러오지 못했습니다.</td></tr>';
    }
  }

  /* ── 테이블 렌더링 ── */
  function renderTable(data) {
    if (!data.length) {
      document.getElementById('tableBody').innerHTML =
        '<tr><td colspan="5" class="empty-msg">신청 내역이 없습니다.</td></tr>';
      return;
    }
    document.getElementById('tableBody').innerHTML = data.map((row, i) => {
      const dt = new Date(row.created_at);
      const dateStr = dt.toLocaleDateString('ko-KR') + ' ' +
                      dt.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
      const loc = [row.preferred_region, row.preferred_district].filter(Boolean).join(' ') || row.region || '전체';
      return `<tr>
        <td>${data.length - i}</td>
        <td>${row.phone || '-'}</td>
        <td>${row.age || '-'}세</td>
        <td>${row.job_types || '-'}</td>
        <td><span class="region-tag">${loc}</span></td>
        <td>${dateStr}</td>
      </tr>`;
    }).join('');
  }

  /* ── 요약 ── */
  function renderSummary(data) {
    document.getElementById('totalCount').textContent = data.length;
    const today = new Date().toLocaleDateString('ko-KR');
    const todayCnt = data.filter(r =>
      new Date(r.created_at).toLocaleDateString('ko-KR') === today
    ).length;
    document.getElementById('todayCount').textContent = todayCnt;
    if (data.length) {
      const last = new Date(data[0].created_at);
      document.getElementById('lastDate').textContent =
        last.toLocaleDateString('ko-KR');
    }
  }

  /* ── CSV 다운로드 ── */
  document.getElementById('btnCsv').addEventListener('click', () => {
    if (!allData.length) { alert('데이터가 없습니다.'); return; }
    const header = ['번호', '전화번호', '나이', '일자리유형', '선호지역', '신청일시'];
    const rows = allData.map((r, i) => {
      const loc = [r.preferred_region, r.preferred_district].filter(Boolean).join(' ') || r.region || '전체';
      return [
        allData.length - i,
        r.phone || '',
        r.age || '',
        r.job_types || '',
        loc,
        new Date(r.created_at).toLocaleString('ko-KR')
      ];
    });
    const csv = [header, ...rows].map(r => r.join(',')).join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `알림신청_${new Date().toLocaleDateString('ko-KR').replace(/\./g,'').trim()}.csv`;
    a.click();
  });

  document.getElementById('btnRefresh').addEventListener('click', loadData);
</script>
</body>
</html>
